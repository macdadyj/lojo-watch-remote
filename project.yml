name: WatchRemote
configFiles:
  Debug: Config/Base.xcconfig
  Release: Config/Base.xcconfig
options:
  bundleIdPrefix: com.lojo
  deploymentTarget:
    iOS: "17.0"
    watchOS: "10.0"
  xcodeVersion: "26.0"
  createIntermediateGroups: true
  groupSortPosition: top
  postGenCommand: python3 scripts/patch-watch-embed.py

packages:
  WatchRemoteCore:
    path: Core
  swift-nio:
    url: https://github.com/apple/swift-nio.git
    from: 2.103.0
  swift-nio-ssh:
    url: https://github.com/apple/swift-nio-ssh.git
    exactVersion: 0.15.0
  swift-nio-transport-services:
    url: https://github.com/apple/swift-nio-transport-services.git
    from: 1.28.0
  swift-crypto:
    url: https://github.com/apple/swift-crypto.git
    from: 4.5.0

settings:
  base:
    SWIFT_VERSION: "5.0"
    CODE_SIGN_STYLE: Automatic
    WATCHREMOTE_HOST_LABEL: example-host
    WATCHREMOTE_HOST_ADDRESS: 100.64.0.2
    WATCHREMOTE_HOST_USER: user
    WATCHREMOTE_HOST_PORT: 22
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    ENABLE_USER_SCRIPT_SANDBOXING: NO
    SWIFT_TREAT_WARNINGS_AS_ERRORS: NO

targets:
  WatchRemote:
    type: application
    platform: iOS
    sources:
      - path: App/iOS
        excludes:
          - Info.plist
    dependencies:
      - package: WatchRemoteCore
        product: WatchRemoteCore
      - package: swift-nio
        product: NIOConcurrencyHelpers
      - package: swift-nio
        product: NIOCore
      - package: swift-nio-ssh
        product: NIOSSH
      - package: swift-nio-transport-services
        product: NIOTransportServices
      - package: swift-crypto
        product: Crypto
      # XcodeGen 2.46.0 puts this in "Embed Watch Content":
      # dstSubfolderSpec 16, dstPath $(CONTENTS_FOLDER_PATH)/Watch.
      # App Store Connect rejects PlugIns (error 90680).
      - target: WatchRemoteWatch
        embed: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.lojo.WatchRemote
        PRODUCT_NAME: WatchRemote
        INFOPLIST_FILE: App/iOS/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
        TARGETED_DEVICE_FAMILY: "1"
        IPHONEOS_DEPLOYMENT_TARGET: "17.0"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SUPPORTS_MACCATALYST: NO
        ENABLE_PREVIEWS: YES

  WatchRemoteWatch:
    type: application
    platform: watchOS
    sources:
      - path: App/Watch
        excludes:
          - Info.plist
    dependencies:
      - package: WatchRemoteCore
        product: WatchRemoteCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.lojo.WatchRemote.watchkitapp
        PRODUCT_NAME: WatchRemoteWatch
        INFOPLIST_FILE: App/Watch/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
        WATCHOS_DEPLOYMENT_TARGET: "10.0"
        SKIP_INSTALL: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_PREVIEWS: YES
    preBuildScripts:
      - name: Copy debug speech fixtures
        basedOnDependencyAnalysis: false
        script: |
          set -euo pipefail
          if [ "${CONFIGURATION}" != "Debug" ]; then
            exit 0
          fi
          src="${SRCROOT}/Fixtures/speech"
          dest="${BUILT_PRODUCTS_DIR}/${FULL_PRODUCT_NAME}"
          mkdir -p "${dest}"
          cp "${src}/"*.wav "${dest}/"

  WatchRemoteWatchUITests:
    type: bundle.ui-testing
    platform: watchOS
    sources:
      - path: App/WatchUITests
        excludes:
          - Info.plist
    dependencies:
      - target: WatchRemoteWatch
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.lojo.WatchRemote.watchkitapp.uitests
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_FILE: App/WatchUITests/Info.plist
        TEST_TARGET_NAME: WatchRemoteWatch
        WATCHOS_DEPLOYMENT_TARGET: "10.0"

  WatchRemoteUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: App/iOSUITests
    dependencies:
      - target: WatchRemote
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.lojo.WatchRemote.uitests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: WatchRemote
        IPHONEOS_DEPLOYMENT_TARGET: "17.0"

  WatchRemoteTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: App/Tests
      - path: Fixtures/speech
        buildPhase: resources
    dependencies:
      - package: WatchRemoteCore
        product: WatchRemoteCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.lojo.WatchRemote.tests
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: ""
        BUNDLE_LOADER: ""
        IPHONEOS_DEPLOYMENT_TARGET: "17.0"

schemes:
  WatchRemote:
    build:
      targets:
        WatchRemote: all
        WatchRemoteWatch: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - WatchRemoteTests
    archive:
      config: Release
      customArchiveName: WatchRemote
  WatchRemoteWatch:
    build:
      targets:
        WatchRemoteWatch: all
        WatchRemoteWatchUITests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - WatchRemoteWatchUITests
  WatchRemoteUI:
    build:
      targets:
        WatchRemote: all
        WatchRemoteUITests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - WatchRemoteUITests
